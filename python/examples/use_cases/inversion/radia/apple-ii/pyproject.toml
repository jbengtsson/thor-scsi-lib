[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-ii"
version = "0.3.0"
description = "Parameterized APPLE-II undulator geometry, field analysis, and phase optimization for RADIA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
apple-ii = "apple_ii.cli:main"
apple-ii-phase-scan = "apple_ii.scan:main"
apple-ii-reference-compare = "apple_ii.reference:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["apple_ii", "apple_ii.*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
